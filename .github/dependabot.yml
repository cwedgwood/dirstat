version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # These modules share pre-v1 APIs; update their compatible set together.
    groups:
      charmbracelet:
        patterns:
          - "github.com/charmbracelet/*"

  # Actions are pinned to immutable commit SHAs. Dependabot keeps those pins
  # current without weakening the supply-chain guarantee.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # init and analyze exchange versioned configuration and must stay in sync.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
