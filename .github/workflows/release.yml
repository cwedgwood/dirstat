# Tagged releases build static Linux binaries and publish them with SHA-256
# checksums. Actions are pinned to immutable commit SHAs.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: verify
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: build release archives
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64 386 riscv64; do
            package="dirstat_${version}_linux_${arch}"
            mkdir -p "dist/$package"
            GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "dist/$package/dirstat" \
              ./cmd/dirstat
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            rm -rf "dist/$package"
          done
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
